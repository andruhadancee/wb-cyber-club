# ── Dev стек ──
# Запуск: docker compose -f docker-compose.staging.yml up -d --build
# Доступ: http://IP:3001 (Basic Auth: dev / dev123)

services:
  # ── App ──
  app-dev:
    build: .
    image: wb-cyber-club-dev:latest
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis-dev:6379
      - PORT=3000
      - NODE_ENV=development
      - DEV_AUTH=true
      - DEV_USER=dev
      - DEV_PASS=dev123
      - SENTRY_DSN=${SENTRY_DSN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-ru-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    depends_on:
      redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uploads_dev:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - dev
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Redis ──
  redis-dev:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - dev
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  dev:
    driver: bridge

volumes:
  uploads_dev:
