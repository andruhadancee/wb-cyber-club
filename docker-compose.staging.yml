# ── Dev стек ──
# Запуск: docker compose -f docker-compose.staging.yml up -d --build
# Доступ: http://IP:3001 (Basic Auth: dev / dev123)

services:
  # ── App ──
  app-dev:
    build: .
    image: wb-cyber-club-dev:latest
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://cyberclub:cyberclub@postgres-dev:5432/cyberclub
      - REDIS_URL=redis://redis-dev:6379
      - PORT=3000
      - NODE_ENV=development
      - DEV_AUTH=true
      - DEV_USER=dev
      - DEV_PASS=dev123
      - SENTRY_DSN=${SENTRY_DSN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uploads_dev:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - dev
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── PostgreSQL (отдельный от прода) ──
  postgres-dev:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cyberclub
      - POSTGRES_PASSWORD=cyberclub
      - POSTGRES_DB=cyberclub
    volumes:
      - pgdata_dev_staging:/var/lib/postgresql/data
    # Порт НЕ открыт наружу — доступ только из Docker-сети
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberclub"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - dev
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Redis ──
  redis-dev:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - dev
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  dev:
    driver: bridge

volumes:
  pgdata_dev_staging:
  uploads_dev:
