name: Deploy

on:
  push:
    branches: [mvp]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & typecheck
        run: |
          npm ci --registry=https://registry.npmjs.org/
          npx prisma generate --schema=server/prisma/schema.prisma
          npx tsc --noEmit
          npx tsc -p server/tsconfig.json --noEmit

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/prod:latest
          DOCKER_BUILDKIT=1 docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            IMAGE=ghcr.io/${{ github.repository }}/prod:latest

            grep -q "8.8.8.8" /etc/resolv.conf || echo "nameserver 8.8.8.8" >> /etc/resolv.conf
            grep -q "1.1.1.1" /etc/resolv.conf || echo "nameserver 1.1.1.1" >> /etc/resolv.conf

            echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            for i in 1 2 3; do
              echo "Pull attempt $i..."
              docker pull "$IMAGE" && break
              sleep 15
            done
            docker tag "$IMAGE" wb-cyber-club:latest

            cd /opt/wb-cyber-club
            git fetch origin mvp && git reset --hard origin/mvp

            # Restart app (migrations run inside entrypoint)
            docker compose stop app || true
            docker compose up -d app
            docker image prune -f

            echo "Deploy completed at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club

            echo "══ Container status ══"
            docker compose ps

            sleep 15

            echo "══ App logs (last 40) ══"
            docker compose logs app --tail 40 --no-color

            echo "══ Health check ══"
            STATUS=$(docker compose ps app --format '{{.Status}}')
            echo "App status: $STATUS"

            if echo "$STATUS" | grep -qi "restarting\|exited"; then
              echo "DEPLOY FAILED"
              exit 1
            fi

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3000/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "401" ]; then
              echo "Deploy OK"
            else
              echo "Health check returned $HEALTH"
              exit 1
            fi
