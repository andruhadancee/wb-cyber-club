name: Deploy

on:
  push:
    branches: [mvp]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & typecheck
        run: |
          npm ci --registry=https://registry.npmjs.org/
          npx prisma generate --schema=server/prisma/schema.prisma
          npx tsc --noEmit
          npx tsc -p server/tsconfig.json --noEmit

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/prod:latest
          DOCKER_BUILDKIT=1 docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            IMAGE=ghcr.io/${{ github.repository }}/prod:latest
            LOCAL_TAG="wb-cyber-club:latest"

            grep -q "8.8.8.8" /etc/resolv.conf || echo "nameserver 8.8.8.8" >> /etc/resolv.conf
            grep -q "1.1.1.1" /etc/resolv.conf || echo "nameserver 1.1.1.1" >> /etc/resolv.conf

            # Save previous image ID for rollback
            PREV_IMAGE=$(docker images --no-trunc -q "$LOCAL_TAG" 2>/dev/null || echo "")
            echo "Previous image: ${PREV_IMAGE:-none}"

            echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            for i in 1 2 3; do
              echo "Pull attempt $i..."
              docker pull "$IMAGE" && break
              sleep 15
            done

            # Tag previous as rollback before overwriting
            if [ -n "$PREV_IMAGE" ]; then
              docker tag "$PREV_IMAGE" "$LOCAL_TAG-rollback" 2>/dev/null || true
            fi

            docker tag "$IMAGE" "$LOCAL_TAG"

            cd /opt/wb-cyber-club
            git fetch origin mvp && git reset --hard origin/mvp

            docker compose up -d --force-recreate --remove-orphans app

            # Recreate certbot/nginx if their compose config changed.
            # `up -d` is a no-op when nothing changed, so it is safe to always run.
            docker compose up -d certbot nginx

            docker image prune -f

            echo "Deploy completed at $(date)"

      - name: Verify deployment
        id: verify
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club

            echo "══ Container status ══"
            docker compose ps

            echo "Waiting for app to start..."
            for i in $(seq 1 6); do
              sleep 5
              STATUS=$(docker compose ps app --format '{{.Status}}' 2>/dev/null || echo "unknown")
              echo "  [$i] $STATUS"
              if echo "$STATUS" | grep -qi "healthy"; then
                break
              fi
              if echo "$STATUS" | grep -qi "restarting\|exited"; then
                echo "DEPLOY FAILED — container crashed"
                docker compose logs app --tail 50 --no-color
                exit 1
              fi
            done

            echo "══ App logs (last 40) ══"
            docker compose logs app --tail 40 --no-color

            echo "══ Health check ══"
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3000/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ]; then
              echo "Deploy OK"
            else
              echo "Health check failed: $HEALTH"
              exit 1
            fi

      - name: Rollback on failure
        if: steps.verify.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            LOCAL_TAG="wb-cyber-club:latest"
            cd /opt/wb-cyber-club

            ROLLBACK=$(docker images --no-trunc -q "${LOCAL_TAG}-rollback" 2>/dev/null || echo "")
            if [ -z "$ROLLBACK" ]; then
              echo "No rollback image available — cannot rollback"
              exit 1
            fi

            echo "Rolling back to previous image: $ROLLBACK"
            docker tag "$ROLLBACK" "$LOCAL_TAG"
            docker compose up -d --force-recreate app

            sleep 10
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3000/api/health 2>/dev/null || echo "000")
            echo "Rollback health: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ]; then
              echo "Rollback successful"
            else
              echo "Rollback also failed — manual intervention required"
              docker compose logs app --tail 30 --no-color
            fi

      - name: Fail pipeline if deploy failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
