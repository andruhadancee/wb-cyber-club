name: Deploy Dev

on:
  push:
    branches: [mvp-2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/andruhadancee/wb-cyber-club-dev:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ── Typecheck (fast, no build artifacts needed) ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc -p server/tsconfig.json --noEmit

      # ── Build & push Docker image (on CI runner — fast) ──
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      # ── Deploy on server (just pull + restart — seconds) ──
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            if [ ! -d /opt/wb-cyber-club-dev ]; then
              git clone -b mvp-2 https://${{ secrets.GH_TOKEN }}@github.com/andruhadancee/wb-cyber-club.git /opt/wb-cyber-club-dev
            fi

            cd /opt/wb-cyber-club-dev
            git fetch origin mvp-2
            git reset --hard origin/mvp-2

            # Login & pull pre-built image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}

            # Restart with new image (no --build!)
            docker compose -f docker-compose.staging.yml up -d
            echo "Dev deploy completed at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club-dev

            echo "══════════ Container status ══════════"
            docker compose -f docker-compose.staging.yml ps

            sleep 15

            echo "══════════ App logs (last 40 lines) ══════════"
            docker compose -f docker-compose.staging.yml logs app-dev --tail 40 --no-color

            echo "══════════ Health check ══════════"
            STATUS=$(docker compose -f docker-compose.staging.yml ps app-dev --format '{{.Status}}')
            echo "App status: $STATUS"

            if echo "$STATUS" | grep -qi "restarting\|exited"; then
              echo "❌ DEPLOY FAILED"
              exit 1
            fi

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "401" ]; then
              echo "✅ Deploy OK"
            else
              echo "⚠️ Health check returned $HEALTH"
              exit 1
            fi
