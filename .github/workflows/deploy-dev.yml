name: Deploy Dev

on:
  push:
    branches: [mvp-2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck backend
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Build frontend
        run: npx vite build

      - name: Build backend
        run: npx tsc -p server/tsconfig.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dev to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            # Первый запуск: клонировать если папки нет
            if [ ! -d /opt/wb-cyber-club-dev ]; then
              git clone -b mvp-2 https://${{ secrets.GH_TOKEN }}@github.com/andruhadancee/wb-cyber-club.git /opt/wb-cyber-club-dev
            fi

            cd /opt/wb-cyber-club-dev
            git fetch origin mvp-2
            git reset --hard origin/mvp-2
            docker compose -f docker-compose.staging.yml up -d --build
            echo "Dev deploy completed at $(date)"

      - name: Verify deployment & show logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club-dev

            echo "══════════ Container status ══════════"
            docker compose -f docker-compose.staging.yml ps

            echo ""
            echo "══════════ Waiting for app to start (30s) ══════════"
            sleep 15

            echo ""
            echo "══════════ App logs (last 40 lines) ══════════"
            docker compose -f docker-compose.staging.yml logs app-dev --tail 40 --no-color

            echo ""
            echo "══════════ Health check ══════════"
            STATUS=$(docker compose -f docker-compose.staging.yml ps app-dev --format '{{.Status}}')
            echo "App status: $STATUS"

            if echo "$STATUS" | grep -qi "restarting\|exited"; then
              echo "❌ DEPLOY FAILED — container is not healthy!"
              exit 1
            fi

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "401" ]; then
              echo "✅ Deploy OK"
            else
              echo "⚠️ Health check returned $HEALTH — check logs above"
              exit 1
            fi
