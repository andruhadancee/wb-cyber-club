name: Deploy Dev

on:
  push:
    branches: [mvp-2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck backend
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Build frontend
        run: npx vite build

      - name: Build backend
        run: npx tsc -p server/tsconfig.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dev to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Первый запуск: клонировать если папки нет
            if [ ! -d /opt/wb-cyber-club-dev ]; then
              git clone -b mvp-2 https://${{ secrets.GH_TOKEN }}@github.com/andruhadancee/wb-cyber-club.git /opt/wb-cyber-club-dev
            fi

            cd /opt/wb-cyber-club-dev
            git fetch origin mvp-2
            git reset --hard origin/mvp-2
            docker compose -f docker-compose.staging.yml up -d --build
            echo "Dev deploy completed at $(date)"
