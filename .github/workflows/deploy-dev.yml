name: Deploy Dev

on:
  push:
    branches: [mvp-2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: wb-cyber-club-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar
        run: docker save wb-cyber-club-dev:latest | gzip > /tmp/image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: /tmp/image.tar.gz
          target: /tmp
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            # DNS fallback
            if ! host github.com >/dev/null 2>&1; then
              grep -q "8.8.8.8" /etc/resolv.conf || echo "nameserver 8.8.8.8" >> /etc/resolv.conf
            fi

            # Clone repo if first time
            if [ ! -d /opt/wb-cyber-club-dev ]; then
              git clone -b mvp-2 https://${{ secrets.GH_TOKEN }}@github.com/andruhadancee/wb-cyber-club.git /opt/wb-cyber-club-dev
            fi

            cd /opt/wb-cyber-club-dev
            for i in 1 2 3; do
              git fetch origin mvp-2 && break
              sleep 10
            done
            git reset --hard origin/mvp-2

            # Load pre-built image
            docker load < /tmp/image.tar.gz
            rm -f /tmp/image.tar.gz

            # Restart
            docker compose -f docker-compose.staging.yml up -d
            docker image prune -f

            echo "Dev deploy completed at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club-dev

            echo "══════════ Container status ══════════"
            docker compose -f docker-compose.staging.yml ps

            sleep 15

            echo "══════════ App logs (last 40 lines) ══════════"
            docker compose -f docker-compose.staging.yml logs app-dev --tail 40 --no-color

            echo "══════════ Health check ══════════"
            STATUS=$(docker compose -f docker-compose.staging.yml ps app-dev --format '{{.Status}}')
            echo "App status: $STATUS"

            if echo "$STATUS" | grep -qi "restarting\|exited"; then
              echo "❌ DEPLOY FAILED"
              exit 1
            fi

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "401" ]; then
              echo "✅ Deploy OK"
            else
              echo "⚠️ Health check returned $HEALTH"
              exit 1
            fi
