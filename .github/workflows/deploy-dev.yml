name: Deploy Dev

on:
  push:
    branches: [mvp-2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc -p server/tsconfig.json --noEmit

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 40m
          script: |
            set -e

            # DNS fallback
            if ! host github.com >/dev/null 2>&1; then
              grep -q "8.8.8.8" /etc/resolv.conf || echo "nameserver 8.8.8.8" >> /etc/resolv.conf
            fi

            # Clone repo if first time
            if [ ! -d /opt/wb-cyber-club-dev ]; then
              git clone -b mvp-2 https://${{ secrets.GH_TOKEN }}@github.com/andruhadancee/wb-cyber-club.git /opt/wb-cyber-club-dev
            fi

            cd /opt/wb-cyber-club-dev

            # Retry git fetch
            for i in 1 2 3; do
              echo "Git fetch attempt $i..."
              git fetch origin mvp-2 && break
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            git reset --hard origin/mvp-2

            # BuildKit for npm cache mount support
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Rebuild only app, keep postgres running
            docker compose -f docker-compose.staging.yml stop app-dev || true
            docker compose -f docker-compose.staging.yml up -d --build app-dev
            docker image prune -f

            echo "Dev deploy completed at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club-dev

            echo "══════════ Container status ══════════"
            docker compose -f docker-compose.staging.yml ps

            sleep 15

            echo "══════════ App logs (last 40 lines) ══════════"
            docker compose -f docker-compose.staging.yml logs app-dev --tail 40 --no-color

            echo "══════════ Health check ══════════"
            STATUS=$(docker compose -f docker-compose.staging.yml ps app-dev --format '{{.Status}}')
            echo "App status: $STATUS"

            if echo "$STATUS" | grep -qi "restarting\|exited"; then
              echo "DEPLOY FAILED"
              exit 1
            fi

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "401" ]; then
              echo "Deploy OK"
            else
              echo "Health check returned $HEALTH"
              exit 1
            fi
