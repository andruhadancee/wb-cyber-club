name: Deploy Dev

on:
  push:
    branches: [mvp-2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & typecheck
        run: |
          npm ci --registry=https://registry.npmjs.org/
          npx prisma generate --schema=server/prisma/schema.prisma
          npx tsc --noEmit
          npx tsc -p server/tsconfig.json --noEmit

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build -t wb-cyber-club-dev:latest .
          echo "── Image size ──"
          docker images wb-cyber-club-dev:latest --format '{{.Size}}'

      - name: Save & compress image
        run: |
          docker save wb-cyber-club-dev:latest | gzip > /tmp/image.tar.gz
          ls -lh /tmp/image.tar.gz

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Transfer image to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" \
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15 \
            /tmp/image.tar.gz \
            root@"$SERVER_HOST":/tmp/wb-cyber-club-dev.tar.gz

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            echo "══ Loading Docker image ══"
            docker load < /tmp/wb-cyber-club-dev.tar.gz
            rm -f /tmp/wb-cyber-club-dev.tar.gz

            # DNS fallback
            grep -q "8.8.8.8" /etc/resolv.conf || echo "nameserver 8.8.8.8" >> /etc/resolv.conf

            if [ ! -d /opt/wb-cyber-club-dev ]; then
              git clone -b mvp-2 https://${{ secrets.GH_TOKEN }}@github.com/andruhadancee/wb-cyber-club.git /opt/wb-cyber-club-dev
            fi

            cd /opt/wb-cyber-club-dev
            git fetch origin mvp-2 && git reset --hard origin/mvp-2

            docker compose -f docker-compose.staging.yml stop app-dev || true
            docker compose -f docker-compose.staging.yml up -d app-dev
            docker image prune -f

            echo "Dev deploy completed at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/wb-cyber-club-dev

            echo "══ Container status ══"
            docker compose -f docker-compose.staging.yml ps

            sleep 15

            echo "══ App logs (last 40) ══"
            docker compose -f docker-compose.staging.yml logs app-dev --tail 40 --no-color

            echo "══ Health check ══"
            STATUS=$(docker compose -f docker-compose.staging.yml ps app-dev --format '{{.Status}}')
            echo "App status: $STATUS"

            if echo "$STATUS" | grep -qi "restarting\|exited"; then
              echo "DEPLOY FAILED"
              exit 1
            fi

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/api/health 2>/dev/null || echo "000")
            echo "Health endpoint: HTTP $HEALTH"

            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "401" ]; then
              echo "Deploy OK"
            else
              echo "Health check returned $HEALTH"
              exit 1
            fi
