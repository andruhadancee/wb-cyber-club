services:
  # ── Nginx (reverse proxy + SSL) ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # ── Certbot (SSL-сертификаты Let's Encrypt) ──
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Автообновление каждые 12 часов
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped
    networks:
      - backend

  # ── App (Express + React static) ──
  app:
    image: wb-cyber-club:latest
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cyberclub}:${POSTGRES_PASSWORD:-cyberclub}@postgres:5432/${POSTGRES_DB:-cyberclub}
      - PORT=3000
      - NODE_ENV=production
      - DOMAIN=${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cyberclub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cyberclub}
      - POSTGRES_DB=${POSTGRES_DB:-cyberclub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт НЕ открыт наружу — доступ только из Docker-сети
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberclub}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # Performance tuning
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  nginx_cache:
