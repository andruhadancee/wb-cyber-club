# ── Локальная разработка через Docker ──
# Запуск: docker compose -f docker-compose.dev.yml up -d --build
# Доступ: http://localhost:3000

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://cyberclub:cyberclub@postgres:5432/cyberclub
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_local:/app/uploads
    restart: unless-stopped
    networks:
      - local

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cyberclub
      - POSTGRES_PASSWORD=cyberclub
      - POSTGRES_DB=cyberclub
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberclub"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - local

networks:
  local:
    driver: bridge

volumes:
  pgdata_dev:
  uploads_local:
